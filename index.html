       'Significantly raise awareness among our core target during the launch period',
       'Become the most recognised brand in the category within a year',
       'Spend ₹5 crore on TV and digital video during the launch quarter'],
 why:'The strong version names <b>audience</b> (new category entrants), <b>scale</b> (75%), <b>intensity</b> (3+ frequency), <b>geography</b> (priority markets) and <b>timing</b> (six weeks). Option B has adjectives but no numbers. Option C has a timeframe but no measurable media deliverable and no baseline. Option D is a <b>budget</b>, not an objective — it says what you will spend, not what the spend must achieve. Recall the construction formula: <i>to [media task] among [audience] by delivering [scale] at [intensity] across [markets] during [period], measured by [KPI + target], in order to contribute to [outcome].</i>'},

{t:'obj',tag:'apply',diff:'medium',
 q:'"Generate 40,000 paid subscriptions from users who completed a free trial, visited the pricing page or used the app 3+ times last month, at CPA below ₹750 over 12 weeks." Which funnel stage, and why?',
 opts:['<b>Conversion</b> — the audience is defined by high-intent behaviour and the KPIs are subscriptions, CPA and conversion rate',
       'Consideration — the users are still evaluating whether to pay',
       'Awareness — the objective is to build the subscriber base',
       'Retention — the users have already downloaded the app'],
 why:'The funnel label follows from <b>the consumer behaviour named</b>. Here it is "<i>purchase a subscription</i>", and the audience is defined by unmistakable intent signals — <b>completed a free trial, visited the pricing page, used the app three or more times.</b> KPIs are paid conversions, <b>CPA</b>, conversion rate and ROAS. Consideration would read "evaluate the brand" with ad-recall and engagement KPIs; retention would target <i>existing paying</i> customers around renewal. Note the pattern across all five worked objectives: <b>audience defined by observed behaviour, a number, a timeframe, and where relevant a baseline.</b>'},

{t:'obj',tag:'concept',diff:'medium',trap:true,
 q:'A brief sets the media objective as "grow sales by 15%". What is the trap, and the fix?',
 opts:['Sales growth is a <b>business</b> outcome — <b>translate it into the media delivery that can influence sales</b>',
       'It is fine as written, provided a timeframe is attached',
       'The trap is the number being too low to justify a media investment',
       'The fix is to add more KPIs so that every channel has something to report'],
 why:'"Using sales growth as a media objective" is the first of the six named traps, and the correction is to <b>translate it into the media delivery that can influence sales</b> — reach, frequency, qualified visits, CPA. Media is one input among many (price, product, distribution, competitor activity), so holding it solely accountable for a sales number is both unfair and unplannable. Option D compounds a second trap: <b>too many KPIs</b>, whose fix is <b>one primary KPI and a few supporting indicators.</b> The eight-point checklist ends with the practical test: <b>can the plan be built from the objective?</b>'},

{t:'obj',tag:'concept',diff:'medium',
 q:'The deck offers a one-line test of whether a media objective is good enough. What is it?',
 opts:['It is specific enough that <b>two planners would build broadly similar plans from it</b>',
       'It fits on a single slide without abbreviations',
       'It can be approved by the client without further questions',
       'It contains at least one metric from each funnel stage'],
 why:'That is the test — <b>two planners, broadly similar plans.</b> It is a neat proxy for the whole eight-point checklist: does it identify the growth source, name the barrier, specify the media task, define an audience <b>sharper than a demographic</b>, set scale and intensity, make geography, context and timing clear, and carry a <b>primary KPI with target and timeframe</b>? If two competent planners would produce very different plans, something in that list is missing. Option D would actually violate the "too many KPIs" trap.'},

/* ============ 08 · MEDIA MIX ============ */
{t:'mix',tag:'concept',diff:'easy',
 q:'What is a <b>media mix</b>, in the deck\'s framing?',
 opts:['The combination of channels used to reach the audience and hit the objective — <b>not which medium is best, but what combination works best</b>',
       'The single most efficient medium for a given objective, chosen after comparing CPMs',
       'The split of budget between paid, owned and earned media',
       'The schedule showing when each channel runs across the campaign period'],
 why:'The framing line is <b>"not which medium is the best but what combination works best."</b> A mix does four things: it is a <b>strategic combination</b> chosen for the audience and objective; it <b>maximises unique reach</b> by bringing in people the first channel would not reach; it <b>assigns complementary roles</b> so each channel does a distinct job; and it <b>delivers objectives more efficiently</b> than any single channel. Option C describes POES; option D describes the flowchart, which sits in the plan below the mix.'},

{t:'mix',tag:'apply',diff:'easy',
 given:['₹50L spent → 60% reach','Option A: +₹10L on the same channel','Option B: +₹10L on a second channel'],
 q:'What happens to reach under each option?',
 opts:['<b>A → 63% (frequency, barely any new reach); B → 70% (real incremental reach)</b>',
       'A → 70% and B → 63%, since concentrating spend builds reach faster',
       'Both reach roughly 65%, since ₹10L buys the same audience either way',
       'A → 60% exactly, because the first channel is completely saturated'],
 why:'This single comparison is the whole economic argument for a mix. <b>Same ₹10 lakh, same 60% starting point: 3 points in the same channel, 10 points in a second one.</b> Extra spend in a saturated channel mostly <b>reaches the same users again — it buys frequency, not reach.</b> A second channel <b>reaches people the first one missed</b>, so the next rupee returns more. Note A is not <i>zero</i> — the curve flattens, it does not stop — so "completely saturated" overstates it.'},

{t:'mix',tag:'concept',diff:'easy',
 q:'By how much does cross-media exposure increase message recall?',
 opts:['<b>25–40%</b>',
       '5–10%',
       '50–75%',
       '100–150%'],
 why:'<b>25–40%</b> is the figure to quote, and it sits under "synergy and amplification" alongside two supporting claims: <b>TV + digital outperforms either channel alone</b>, and <b>paid search CTR lifts when the brand has a strong TV presence</b>. That last one is the mechanism behind the sequencing chain from Chapter 2 — TV and OOH drive a search lift, paid search captures it, digital retargets, retail media closes. The fourth argument for a mix is <b>risk diversification</b>: over-reliance on one channel exposes you to algorithm changes at Meta or Google, and to saturation.'},

{t:'mix',tag:'apply',diff:'medium',trap:true,
 given:['Reach: TV 90, OLV 70, CRM 25','Affinity: TV 110, OLV 125, CRM 140','Time spent: TV 70, OLV 110, CRM 120'],
 q:'When normalising these to 0–100, what is the correct method?',
 opts:['Find the highest value <b>separately for each criterion</b> — 90 for reach, 140 for affinity, 120 for time spent',
       'Use one common maximum — 140, the largest number anywhere in the table',
       'Use 100 as the maximum for every criterion, since scores are already percentages',
       'Normalise against the average of each column rather than its maximum'],
 why:'<b>Find the highest value separately for Reach, Affinity and Time Spent — do not use one common maximum.</b> The three criteria are measured in different units (a percentage, an index, minutes), so a shared maximum would silently penalise whichever criterion happens to use smaller numbers.<div class="work">Reach:  TV 90 ÷ 90 × 100 = 100.0 · OLV 70 ÷ 90 × 100 = 77.8 · CRM 25 ÷ 90 × 100 = 27.8</div>The same rule governs the Retail Media Index in Chapter 6, where step 3 adds a second condition: <b>every input must point the same way — higher is better — so invert costs or return rates first.</b>'},

{t:'mix',tag:'calc',diff:'medium',
 given:['Base scores — TV 100/65/70 · Digital 75/90/85 · CRM 25/100/95','Awareness weights: R 50% · A 30% · TS 20%'],
 q:'Which channel wins on awareness weights, and with what score?',
 opts:['<b>TV, with 83.5</b> — scale carries the greatest weight',
       'Digital, with 84.0 — it scores highest on two of the three criteria',
       'CRM / Owned, with 90.3 — its affinity and time-spent scores are the strongest',
       'TV, with 235 — you add the three raw scores together'],
 why:'<div class="work">TV      = (100×.50) + (65×.30) + (70×.20) = 50 + 19.5 + 14 = <b>83.5</b><br>Digital = (75×.50) + (90×.30) + (85×.20) = 37.5 + 27 + 17 = 81.5<br>CRM     = (25×.50) + (100×.30) + (95×.20) = 12.5 + 30 + 19 = 61.5</div><b>TV leads because scale carries the greatest weight.</b> 84.0 is Digital\'s score under <i>consideration</i> weights (30/40/30), and 90.3 is CRM\'s under <i>conversion</i> weights — both correct numbers attached to the wrong question, which is the trap. Adding raw scores ignores the weights entirely and would make every objective produce the same winner.'},

{t:'mix',tag:'concept',diff:'medium',trap:true,
 q:'Across awareness (50/30/20), consideration (30/40/30) and conversion (10/25/15/50) weightings, the winner changes from TV to Digital to CRM — with <b>identical base scores</b>. What does this show?',
 opts:['The scorecard does not discover the best channel — it makes the <b>objective\'s implications arithmetic and explicit</b>, which is also why the weights must be justifiable',
       'The base scores must have been measured incorrectly, since a good channel should win consistently',
       'The method is unreliable and should be replaced by media mix modelling',
       'Conversion potential should always be included, which would settle the ranking'],
 why:'Same channels, different weights, different winner — <b>only the weights change; the base channel scores remain constant.</b> The scorecard is a device for making an objective\'s consequences explicit and defensible, not an oracle. That cuts both ways: because the weights decide the outcome, <b>each one should be justifiable in a sentence</b>, and step 4 of the method still insists you <b>rank the totals but apply planning judgement before the final choice.</b> MMM answers a different question — which channels <i>actually drove sales</i> — and takes months, so it cannot replace this.'},

{t:'mix',tag:'apply',diff:'medium',
 q:'Which watch-out belongs to <b>Connected TV</b> specifically?',
 opts:['<b>Household profiling may not identify the viewer</b>, and cross-screen reach and frequency need <b>deduplication</b>',
       'Limited exposure time means the creative must be very simple',
       'It is a background medium only, and repetition causes wear-out quickly',
       'High cost per direct contact, and incremental impact is hard to attribute'],
 why:'CTV\'s strength is <b>household profiling and targeting</b>, and its watch-outs follow directly from that: the household is not the same as the person watching, inventory and measurement are <b>fragmented</b>, and combining CTV with linear requires <b>deduplication</b> or you will double-count reach. The distractors belong to <b>OOH</b> (limited exposure time → simple creative), <b>radio</b> (background medium, wear-out) and <b>experiential</b> (high cost per contact, hard to attribute). The summary rule: <b>use linear TV for scale; use CTV for precision and incremental reach.</b>'},

{t:'mix',tag:'concept',diff:'medium',
 q:'Which task is <b>MMM the wrong tool</b> for?',
 opts:['<b>Real-time, in-flight optimisation</b> — results take months to produce',
       'Annual budget planning across channels',
       'Comparing the long-run ROI of TV against social',
       'Understanding baseline sales versus media-driven uplift'],
 why:'MMM takes <b>2+ years of weekly sales</b> plus spend, price, seasonality and competitor activity, and uses <b>regression</b> to separate the drivers — accounting for <b>carryover</b> (effects lingering after spend stops) and <b>diminishing returns</b>. That makes it excellent for annual budgets, long-run channel ROI, baseline versus uplift, and scenario planning. It is the wrong tool for <b>real-time decisions, optimising within a channel, small brands with limited history, individual digital touchpoints, and single campaigns in isolation.</b> Hence the three-tool split: <b>MMM</b> for annual weight, <b>attribution (MTA)</b> for in-campaign digital optimisation, and <b>pilot tests</b> for proving true incrementality.'},
];

/* =========================================================================
   SOUND — synthesised with WebAudio, no files, no network.
   The context is created lazily on the first click, which satisfies autoplay.
   ========================================================================= */
let AC=null, SOUND=true;
try{ if(localStorage.getItem('mb_sound')==='0') SOUND=false; }catch(e){}
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume();
  return AC;
}
function tone(freq,at,dur,type,vol,glideTo){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+at;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(glideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,glideTo),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}
function noise(at,dur,vol,freq){
  const c=ac(); if(!c) return;
  const t0=c.currentTime+at, n=Math.floor(c.sampleRate*dur);
  const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||900;
  const g=c.createGain(); g.gain.setValueAtTime(vol||0.2,t0);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t0); src.stop(t0+dur+0.02);
}
/* correct — a major arpeggio that climbs higher the longer the streak runs */
function sfxRight(streak){
  if(!SOUND) return;
  const base=523.25*Math.pow(2,Math.min(4,Math.floor((streak-1)/4))/12*2);
  const notes=[1,1.26,1.5,2];                         // root, M3, P5, octave
  notes.forEach((m,i)=>tone(base*m,i*0.055,0.26,'triangle',0.17));
  if(streak>=3) tone(base*2.52,0.235,0.34,'sine',0.13);
  if(streak>=7){ tone(base*3,0.30,0.4,'sine',0.11); noise(0,0.16,0.09,2600); }
  if(streak>=12){ [0,.09,.18].forEach((t,i)=>tone(base*(3+i*0.5),0.34+t,0.3,'triangle',0.09)); }
}
/* wrong — a fat descending buzzer plus a thud */
function sfxWrong(){
  if(!SOUND) return;
  tone(196,0,0.42,'sawtooth',0.20,72);
  tone(146.8,0.03,0.46,'square',0.13,58);
  noise(0,0.28,0.26,420);

  7:'UNSTOPPABLE! ⚡',8:'MONSTROUS! 👹',10:'GODLIKE! 🌌',12:'INFERNO! ☄️',15:'LEGENDARY! 👑',18:'ELASTIC GOD! 🏛️'};

function onAnswer(ok,x,y,card){
  if(ok){
    G.streak++; G.best=Math.max(G.best,G.streak);
    const bonus=Math.min(30,Math.max(0,(G.streak-1)*4));    // streak bonus grows with the run
    const gain=10+bonus;
    const before=levelInfo().idx; G.xp+=gain; levelUpCheck(before);
    sfxRight(G.streak);
    crackers(x,y,G.streak);
    greenFlash(G.streak);
    mega(G.streak>=12?'🏆':(G.streak>=7?'💥':(G.streak>=3?'🔥':'👍')),true);

/* ---------- 🎆 crackers — intensity scales with the streak ---------- */
const CRK=['#22D3EE','#8B5CF6','#F472B6','#4ADE80','#FBBF24','#FB7185','#FFFFFF'];
function burstAt(x,y,n,spread,size){
  const ring=el('div','boom');ring.style.left=x+'px';ring.style.top=y+'px';
  const rs=spread*1.6;ring.style.width=rs+'px';ring.style.height=rs+'px';
  ring.style.borderColor=rnd(CRK);document.body.appendChild(ring);setTimeout(()=>ring.remove(),740);
  for(let i=0;i<n;i++){
    const ang=(i/n)*Math.PI*2+Math.random()*0.4;
    const r=spread*(0.5+Math.random()*0.75);
    const s=el('div','spark'),dot=el('i');s.appendChild(dot);
    s.style.left=x+'px';s.style.top=y+'px';
    const col=rnd(CRK),w=size*(0.6+Math.random()*0.9);
    dot.style.background=col;dot.style.boxShadow='0 0 10px '+col+',0 0 22px '+col;
    dot.style.width=w+'px';dot.style.height=w+'px';
    const d=0.8+Math.random()*0.6;
    s.style.setProperty('--tx',(Math.cos(ang)*r).toFixed(1)+'px');
    s.style.setProperty('--ty',(Math.sin(ang)*r).toFixed(1)+'px');
    s.style.setProperty('--d',d.toFixed(2)+'s');
    document.body.appendChild(s);setTimeout(()=>s.remove(),(d+0.4)*1000);
  }
}
function launchTo(x,y,n,spread,size){
  const rd=0.30+Math.random()*0.18;
  const rk=el('div','rocket');rk.style.left=x+'px';rk.style.top=innerHeight+'px';
  const col=rnd(CRK);rk.style.background=col;rk.style.boxShadow='0 0 12px '+col;
  rk.style.setProperty('--ry',(y-innerHeight)+'px');rk.style.setProperty('--rd',rd.toFixed(2)+'s');
  document.body.appendChild(rk);
  setTimeout(()=>{rk.remove();burstAt(x,y,n,spread,size);if(SOUND)noise(0,0.12,0.07,2200);},rd*1000);
}

/* tier 0: 2 shells · tier 1 (3+): 3 · tier 2 (7+): 5 + white flash
   tier 3 (12+): 8 shells, wider, plus a confetti barrage                    */
function crackers(x,y,streak){
  if(reduced)return;
  if(x==null||isNaN(x)){x=innerWidth/2;y=innerHeight/2;}
  const s=streak||1;
  const tier = s>=12?3 : s>=7?2 : s>=3?1 : 0;
  const shells=[2,3,5,8][tier];
  const grow=1.25+tier*0.32;
  burstAt(x,y,Math.round(20*grow),Math.round(120*grow),7+tier);
  const W=innerWidth,H=innerHeight;
  for(let i=0;i<shells;i++){
    const sx=W*(0.10+Math.random()*0.80), sy=H*(0.10+Math.random()*0.32);
    setTimeout(()=>launchTo(sx,sy,Math.round(26*grow),Math.round(150*grow),6+tier),70+i*130);
  }
  if(tier>=1)confetti(24*tier);
  if(tier>=3){
    confetti(90);
    setTimeout(()=>{for(let i=0;i<4;i++){const sx=W*(0.12+Math.random()*0.76),sy=H*(0.08+Math.random()*0.30);
      setTimeout(()=>launchTo(sx,sy,36,225,9),i*120);}},720);
  }
}
function confetti(count){if(reduced)return;const cols=['#22D3EE','#8B5CF6','#F472B6','#4ADE80','#FBBF24'];const n=count||100;
  for(let i=0;i<n;i++){const c=el('div','confetti');c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.transform='rotate('+(Math.random()*360)+'deg)';

const cst=document.createElement('style');cst.textContent='@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.2}}';document.head.appendChild(cst);

document.addEventListener('keydown',e=>{

  if($('#badgeOvl'))return;

/* ---------- MCQ ---------- */
function mcqNode(Q,card,onScore){
  const box=el('div','mcq');
  const tagLb={apply:'⚙ Apply',case:'🏷 Case',calc:'🧮 Calculate',concept:'◈ Concept'};
  let head='<span class="tag '+Q.tag+'">'+(tagLb[Q.tag]||'◈ Concept')+'</span>';
  if(Q.diff)head+='<span class="tag '+Q.diff+'">'+Q.diff+'</span>';
  if(Q.trap)head+='<span class="tag trap">🃏 tricky</span>';
  box.innerHTML=head+'<div class="q">'+Q.q+'</div>';
  if(Q.given)box.appendChild(el('div','givens',Q.given.map(g=>'<span>'+g+'</span>').join('')));
  const opts=el('div','opts');box.appendChild(opts);
  const letters=['A','B','C','D'],order=shuffle(Q.opts.map((o,i)=>({o,i})));let done=false;
  order.forEach((item,pos)=>{
    const b=el('button','opt','<span class="lt">'+letters[pos]+'</span>'+item.o);
    b.onclick=e=>{
      if(done)return;done=true;box.dataset.done='1';const ok=item.i===0;
      [...opts.children].forEach((c,j)=>{c.disabled=true;
        if(order[j].i===0)c.classList.add('correct');else if(j===pos)c.classList.add('wrong');else c.classList.add('dim');});
      onAnswer(ok,e.clientX,e.clientY,card);onScore&&onScore(ok);
      const why=el('div','why','<h5>'+(ok?'Why this is right →':'Why the answer is what it is →')+'</h5><p>'+Q.why+'</p>');
      box.appendChild(why);requestAnimationFrame(()=>why.classList.add('show'));
    };
    opts.appendChild(b);});
  return box;
}

/* ---------- quiz ---------- */
let quizState=null;
/* SCOPE — which questions this attempt covers.
   FOCUS = a single topic id (sidebar click), null = the full paper.
   MISSED = questions got wrong on the last attempt, for the retry drill. */
let FOCUS=null, ACTIVE=QUIZ.slice(), MISSED=[];
let TRAPS=ACTIVE.filter(q=>q.trap).length;
function setScope(mode,id){
  if(mode==='topic'){FOCUS=id; ACTIVE=QUIZ.filter(q=>q.t===id);}
  else if(mode==='missed'&&MISSED.length){FOCUS=null; ACTIVE=MISSED.slice();}
  else {FOCUS=null; ACTIVE=QUIZ.slice();}
  TRAPS=ACTIVE.filter(q=>q.trap).length;
  renderQuiz();
  window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});
}
function renderQuiz(){

    'Options are reshuffled every attempt, so the answer is never always “A”. '+

    '<div class="srcrow">'+TOPICS.map(t=>'<span class="src">'+t.name+'</span>').join('')+'</div>';

    m.appendChild(h);

      card.appendChild(mcqNode(q,card,ok=>{
        quizState.answered++;quizState.per[q.t].a++;
        if(ok){quizState.correct++;quizState.per[q.t].c++;if(q.trap)quizState.traps++;}
        else quizState.missed.push(q);
        const p=quizState.per[q.t];
        if(p.a===p.n&&p.c===p.n){const map={land:'b_land',plan:'b_plan',metric:'b_metric',strat:'b_strat',aud:'b_aud',mkt:'b_mkt',obj:'b_obj',mix:'b_mix'};if(map[q.t])unlock(map[q.t]);}

  const R=80,C=2*Math.PI*R;const rw=el('div','ring-wrap');
  rw.innerHTML='<div class="ring"><svg width="200" height="200" viewBox="0 0 200 200">'+
    '<circle cx="100" cy="100" r="'+R+'" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="16"/>'+
    '<circle id="ringArc" cx="100" cy="100" r="'+R+'" fill="none" stroke="url(#gg)" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/>'+
    '<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F472B6"/></linearGradient></defs></svg>'+
    '<div class="mid"><div class="big" id="ringPct">0%</div><div class="sm">'+correct+' / '+total+'</div></div></div>';
  const g=grade(pct),gs=el('div');
  gs.innerHTML='<div class="grade" style="color:'+g[1]+'">'+g[0]+'</div><div class="sub">You answered '+correct+' of '+total+' correctly · longest streak <b>'+G.best+'</b> · tricky questions cleared <b>'+quizState.traps+' / '+TRAPS+'</b>.</div>';
  rw.appendChild(gs);rc.appendChild(rw);
  const meters=el('div','meters');let weak=null;
  TOPICS.forEach(t=>{const p=per[t.id];if(!p.n)return;const r=p.c/p.n;
    if(weak===null||r<weak.r)weak={id:t.id,name:t.name,r};
    const mt=el('div','meter');
    mt.innerHTML='<div class="top"><span>'+t.name+'</span><span class="sc">'+p.c+'/'+p.n+'</span></div><div class="bar"><i data-w="'+(r*100)+'"></i></div>';
    meters.appendChild(mt);});
  rc.appendChild(meters);
  if(weak&&weak.r<1){
    const w=el('div','watch');
    w.innerHTML='<h5>Weakest section: '+weak.name+'</h5><p style="color:#ffd9e0">Reread the Why panels in that block — they carry the full working. <a style="color:var(--cyan);cursor:pointer" id="goWeak">Practise just this section →</a></p>';
    rc.appendChild(w);}
  const row=el('div','row-btns');
  if(MISSED.length){
    const dr=el('button','btn btn-grad','🎯 Drill the '+MISSED.length+' I missed');
    dr.onclick=()=>setScope('missed');
    row.appendChild(dr);
  }
  const rt=el('button','btn '+(MISSED.length?'btn-ghost':'btn-grad'),'↺ Reshuffle &amp; Retake');
  rt.onclick=()=>{renderQuiz();window.scrollTo({top:0,behavior:reduced?'auto':'smooth'});};
  row.appendChild(rt);
  if(FOCUS||ACTIVE.length!==QUIZ.length){
    const fa=el('button','btn btn-ghost','◎ Sit the full paper');
    fa.onclick=()=>setScope('all');
    row.appendChild(fa);
  }
  rc.appendChild(row);
  rc.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
  requestAnimationFrame(()=>{
    const arc=$('#ringArc');arc.style.transition=reduced?'none':'stroke-dashoffset 1.1s var(--spring)';
    arc.style.strokeDashoffset=C*(1-pct/100);
    meters.querySelectorAll('.bar i').forEach((b,i)=>setTimeout(()=>b.style.width=b.dataset.w+'%',reduced?0:120+i*80));
    const node=$('#ringPct');
    if(reduced)node.textContent=pct+'%';
    else{const t0=performance.now();(function tk(now){const p=Math.min(1,(now-t0)/1100);node.textContent=Math.round(pct*p)+'%';if(p<1)requestAnimationFrame(tk);})(t0);}
  });
  const wb=$('#goWeak');
  if(wb)wb.onclick=()=>setScope('topic',weak.id);
  if(pct>=75){sfxFanfare();confetti(140);crackers(innerWidth*0.5,innerHeight*0.38,14);mega(pct===100?'👑':'🎉',true);bigCall(pct===100?'FLAWLESS! 👑':'WELL PLAYED! 🎉');}
  else{sfxSad();mega('😬',false);}
}

/* ---------- badges panel ---------- */
/* opens over the quiz so an attempt in progress is never lost */
$('#hBadge').onclick=()=>{
  if($('#badgeOvl'))return;
  const ovl=el('div','ovl');ovl.id='badgeOvl';
  const card=el('div','card');
  card.innerHTML='<div class="eyebrow">Achievements</div><h1 class="tt">Your badges — '+Object.keys(G.badges).length+' / '+BADGES.length+'</h1>'+
    '<div class="sub">Earned by clearing sections, dodging the tricky questions, running streaks and scoring high on a full attempt.</div>';
  const grid=el('div','badgegrid');
  BADGES.forEach(b=>{const c=el('div','bcard'+(G.badges[b.id]?' unlocked':''));
    c.innerHTML='<div class="em">'+(G.badges[b.id]?b.em:'🔒')+'</div><div class="bn">'+b.name+'</div><div class="bd">'+b.desc+'</div>';
    grid.appendChild(c);});
  card.appendChild(grid);
  const row=el('div','row-btns');
  const bk=el('button','btn btn-grad','← Back to the quiz');
  const close=()=>ovl.remove();
  bk.onclick=close;row.appendChild(bk);card.appendChild(row);
  const x=el('button','x','×');x.onclick=close;
  ovl.appendChild(x);ovl.appendChild(card);
  ovl.onclick=e=>{if(e.target===ovl)close();};
  document.addEventListener('keydown',function esc(e){if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);}});
  document.body.appendChild(ovl);
};

/* ---------- init ---------- */
renderHUD();renderQuiz();
</script>
</body>
