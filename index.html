<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Basics · Session Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070B1A; --cyan:#22D3EE; --violet:#8B5CF6; --pink:#F472B6;
  --lime:#4ADE80; --red:#FB7185; --gold:#FBBF24;
  --grad:linear-gradient(100deg,#22D3EE,#8B5CF6,#F472B6);
  --glass:rgba(255,255,255,.05); --glass-brd:rgba(255,255,255,.12);
  --ink:#E7ECFF; --muted:#9AA6C9; --spring:cubic-bezier(.22,1.4,.36,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',monospace}
.bg-fx{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 26s var(--spring) infinite alternate}
.orb.a{width:520px;height:520px;background:#1e3a8a;top:-160px;left:-120px}
.orb.b{width:460px;height:460px;background:#6d28d9;bottom:-180px;right:-100px;animation-duration:32s}
.orb.c{width:380px;height:380px;background:#0e7490;top:40%;left:55%;animation-duration:29s}
.orb.d{width:300px;height:300px;background:#be185d;top:12%;right:18%;animation-duration:35s;opacity:.35}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,50px) scale(1.15)}}
.grid-fx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(139,92,246,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.09) 1px,transparent 1px);
  background-size:46px 46px;-webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 60%);mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),transparent 60%)}
/* ===== header w/ game HUD ===== */
header{position:sticky;top:0;z-index:50;padding:2px;margin:12px;border-radius:20px;background:var(--grad);background-size:300% 300%;animation:flow 8s linear infinite}
@keyframes flow{to{background-position:300% 0}}
.hdr-in{background:rgba(9,13,28,.88);backdrop-filter:blur(14px);border-radius:18px;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;min-width:180px}
.brand .k{font-size:11px;letter-spacing:.26em;color:var(--cyan);font-weight:600}
.brand .t{font-size:18px;font-weight:700}
.brand .s{font-size:11px;color:var(--muted)}
.hud{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lvl{display:flex;flex-direction:column;gap:3px;min-width:170px}
.lvl .top{display:flex;justify-content:space-between;font-size:11px}
.lvl .top .ti{font-weight:700;color:#fff}
.lvl .top .xp{font-family:'JetBrains Mono',monospace;color:var(--gold)}
.lvl .bar{height:8px;border-radius:8px;background:rgba(255,255,255,.09);overflow:hidden}
.lvl .bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--grad);background-size:200% 100%;animation:shim 2.5s linear infinite;transition:width .6s var(--spring)}
@keyframes shim{to{background-position:200% 0}}
.chip{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:12px;padding:7px 12px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;transition:.3s}
.chip.streak{color:var(--gold)}
.chip.streak.t1{border-color:rgba(251,191,36,.45);box-shadow:0 0 14px rgba(251,191,36,.22)}
.chip.streak.t2{border-color:rgba(251,146,60,.7);box-shadow:0 0 20px rgba(251,146,60,.38);color:#FDBA74}
.chip.streak.t3{border-color:rgba(244,114,182,.85);box-shadow:0 0 28px rgba(244,114,182,.5);color:#FBCFE8;animation:pulseHot 1.1s ease-in-out infinite alternate}
@keyframes pulseHot{to{transform:scale(1.07)}}
.chip.badge,.chip.snd{cursor:pointer}
.chip.badge{color:var(--cyan)}
.chip.snd{color:var(--pink)}
.chip.snd.off{color:var(--muted);opacity:.65}
.chip .lab{font-size:10px;letter-spacing:.12em;color:var(--muted);font-family:'Space Grotesk',sans-serif;font-weight:600}
/* ===== layout ===== */
.wrap{display:grid;grid-template-columns:290px 1fr;gap:20px;padding:6px 18px 96px;max-width:1320px;margin:0 auto}
aside{position:sticky;top:104px;align-self:start;max-height:calc(100vh - 124px);overflow-y:auto;padding-right:4px}
aside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:rgba(139,92,246,.4);border-radius:6px}
.side-h{font-size:11px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin:4px 0 10px 6px}
.pbar{height:8px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden;margin:0 6px 16px}
.pbar i{display:block;height:100%;width:0;border-radius:8px;background:var(--grad);background-size:200% 100%;animation:shim 2.5s linear infinite;transition:width .6s var(--spring)}
.topic{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:7px;border-radius:13px;background:var(--glass);border:1px solid transparent;cursor:pointer;transition:.25s;font-size:13.5px}
.topic:hover{border-color:var(--glass-brd);transform:translateX(3px)}
.topic .idx{width:24px;height:24px;flex:0 0 24px;border-radius:8px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;background:rgba(255,255,255,.08);color:var(--muted)}
.topic.done .idx{background:var(--grad);color:#08111f}
.topic .nm{flex:1;line-height:1.2;display:flex;flex-direction:column;gap:2px;min-width:0}
.topic .nm small{font-size:10.5px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.topic .flame{font-style:normal;font-size:12px}
.topic .sc{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--cyan)}
.topic.done{border-color:rgba(74,222,128,.34)}
.topic.hot{border-color:rgba(251,191,36,.3)}
main{min-width:0}
.card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:20px;padding:26px 28px;backdrop-filter:blur(10px);margin-bottom:18px;animation:popIn .5s var(--spring) both}
@keyframes popIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan);font-weight:600;margin-bottom:6px}
h1.tt{font-size:26px;margin:0 0 4px;font-weight:700}
.sub{color:var(--muted);font-size:14px;line-height:1.6}
.sub b{color:#D6DDF7}
.srcrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.src{font-family:'JetBrains Mono',monospace;font-size:11px;padding:5px 11px;border-radius:999px;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.45);color:#d6ccff}
.watch{margin-top:14px;background:rgba(251,113,133,.09);border:1px solid rgba(251,113,133,.45);border-left:4px solid var(--red);border-radius:12px;padding:14px 16px}
.watch h5{margin:0 0 4px;color:var(--red);font-size:14px} .watch p{margin:0;font-size:13.5px;color:#ffd9e0;line-height:1.5}
/* ===== buttons / mcq ===== */
.btn{border:0;font-family:inherit;font-weight:600;cursor:pointer;border-radius:12px;transition:.25s;font-size:14px}
.btn-grad{background:var(--grad);background-size:200% auto;color:#08111f;padding:12px 24px;box-shadow:0 6px 24px rgba(139,92,246,.35)}
.btn-grad:hover{background-position:100% center;transform:translateY(-2px)}
.btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--glass-brd);color:var(--ink);padding:11px 20px}
.btn-ghost:hover{border-color:var(--cyan);color:#fff}
.row-btns{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.mcq{margin-top:8px}.mcq .q{font-size:16px;font-weight:600;margin-bottom:8px;line-height:1.5}
.mcq .q b{color:#fff}
.givens{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
.givens span{font-family:'JetBrains Mono',monospace;font-size:11.5px;padding:4px 9px;border-radius:8px;background:rgba(34,211,238,.09);border:1px solid rgba(34,211,238,.28);color:#bfe9f4}
.tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.05em;padding:3px 10px;border-radius:999px;margin:0 6px 10px 0}
.tag.concept{background:rgba(34,211,238,.14);color:var(--cyan);border:1px solid rgba(34,211,238,.4)}
.tag.apply{background:rgba(251,191,36,.14);color:var(--gold);border:1px solid rgba(251,191,36,.4)}
.tag.calc{background:rgba(74,222,128,.14);color:var(--lime);border:1px solid rgba(74,222,128,.45)}
.tag.case{background:rgba(244,114,182,.16);color:var(--pink);border:1px solid rgba(244,114,182,.5)}
.tag.easy{background:rgba(74,222,128,.13);color:var(--lime)}.tag.medium{background:rgba(251,191,36,.13);color:var(--gold)}.tag.hard{background:rgba(251,113,133,.13);color:var(--red)}
.tag.trap{background:rgba(139,92,246,.2);color:#ddd0ff;border:1px solid rgba(139,92,246,.6);animation:trapGlow 2.2s ease-in-out infinite alternate}
@keyframes trapGlow{to{box-shadow:0 0 14px rgba(139,92,246,.55)}}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--glass-brd);border-radius:12px;padding:14px 16px;cursor:pointer;font-family:inherit;font-size:14.5px;color:var(--ink);transition:.18s;position:relative;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--cyan);transform:translateX(3px)}.opt:disabled{cursor:default}
.opt .lt{font-family:'JetBrains Mono',monospace;color:var(--violet);font-weight:700;margin-right:10px}
.opt.correct{border-color:var(--lime);background:rgba(74,222,128,.16);box-shadow:0 0 34px rgba(74,222,128,.4);animation:popBig .6s var(--spring)}
.opt.wrong{border-color:var(--red);background:rgba(251,113,133,.2);box-shadow:0 0 34px rgba(251,113,133,.4);animation:shakeHard .55s}.opt.dim{opacity:.32}
@keyframes popBig{0%{transform:scale(1)}30%{transform:scale(1.075)}55%{transform:scale(.99)}75%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shakeHard{0%,100%{transform:translateX(0) rotate(0)}12%{transform:translateX(-14px) rotate(-1.4deg)}26%{transform:translateX(14px) rotate(1.4deg)}42%{transform:translateX(-11px) rotate(-1deg)}58%{transform:translateX(11px) rotate(1deg)}74%{transform:translateX(-6px)}88%{transform:translateX(6px)}}
.why{margin-top:14px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.4);border-radius:12px;padding:14px 16px;opacity:0;transform:translateY(8px);transition:.4s;max-height:0;overflow:hidden}
.why.show{opacity:1;transform:none;max-height:900px}
.why h5{margin:0 0 4px;color:var(--gold);font-size:13px}.why p{margin:0 0 8px;font-size:13.5px;color:#ffeec4;line-height:1.6}
.why p:last-child{margin-bottom:0}
.why .work{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:#ffe0a3;background:rgba(0,0,0,.28);border-radius:8px;padding:9px 11px;margin:8px 0;line-height:1.7;overflow-x:auto;white-space:pre-wrap}
.floater{position:fixed;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:28px;pointer-events:none;z-index:999;text-shadow:0 3px 14px rgba(0,0,0,.6);animation:rise 1.25s var(--spring) forwards}
@keyframes rise{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-110px) scale(1.6)}}
/* ===== BIG REACTION TEXT ===== */
.bigcall{position:fixed;left:50%;top:26%;transform:translateX(-50%);z-index:1000;pointer-events:none;font-weight:700;
  font-size:clamp(38px,9vw,86px);letter-spacing:-.01em;text-align:center;white-space:nowrap;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:callIn 1.6s var(--spring) forwards;filter:drop-shadow(0 0 32px rgba(139,92,246,.75))}
.bigcall.bad{background:linear-gradient(100deg,#FB7185,#F43F5E,#FDA4AF);-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 34px rgba(251,113,133,.8));animation:callBad 1.5s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes callIn{0%{opacity:0;transform:translateX(-50%) scale(.25) rotate(-9deg)}
  18%{opacity:1;transform:translateX(-50%) scale(1.28) rotate(3deg)}
  32%{transform:translateX(-50%) scale(1) rotate(-1.5deg)}
  44%{transform:translateX(-50%) scale(1.1) rotate(0deg)}
  80%{opacity:1;transform:translateX(-50%) scale(1.02)}
  100%{opacity:0;transform:translateX(-50%) scale(1.14) translateY(-46px)}}
@keyframes callBad{0%{opacity:0;transform:translateX(-50%) scale(2.2) rotate(6deg)}
  16%{opacity:1;transform:translateX(-50%) scale(.9) rotate(-4deg)}
  26%{transform:translateX(-50%) scale(1.12) rotate(3deg)}
  38%{transform:translateX(-50%) scale(.98) rotate(-2deg)}
  50%{transform:translateX(-50%) scale(1.04) rotate(0deg)}
  82%{opacity:1}
  100%{opacity:0;transform:translateX(-50%) scale(.86) translateY(34px)}}
/* ===== GIANT STAMPS — the exaggerated reaction ===== */
.mega{position:fixed;left:50%;top:47%;z-index:999;pointer-events:none;user-select:none;line-height:1;
  font-size:clamp(150px,33vw,330px);filter:drop-shadow(0 22px 48px rgba(0,0,0,.75))}
.mega.down{animation:megaDown 1.5s cubic-bezier(.18,.85,.3,1) forwards}
@keyframes megaDown{
  0%{opacity:0;transform:translate(-50%,-160%) scale(.35) rotate(-42deg)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.42) rotate(9deg)}
  25%{transform:translate(-50%,-50%) scale(1.02) rotate(-7deg)}
  36%{transform:translate(-50%,-50%) scale(1.24) rotate(5deg)}
  47%{transform:translate(-50%,-50%) scale(1.08) rotate(-3deg)}
  58%{transform:translate(-50%,-50%) scale(1.15) rotate(0deg)}
  78%{opacity:.95;transform:translate(-50%,-50%) scale(1.12)}
  100%{opacity:0;transform:translate(-50%,26%) scale(.82) rotate(17deg)}}
.mega.up{animation:megaUp 1.25s cubic-bezier(.2,1.35,.35,1) forwards}
@keyframes megaUp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.15) rotate(-16deg)}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(7deg)}
  34%{transform:translate(-50%,-50%) scale(1) rotate(-4deg)}
  48%{transform:translate(-50%,-50%) scale(1.14) rotate(0deg)}
  72%{opacity:.9}
  100%{opacity:0;transform:translate(-50%,-130%) scale(1.3) rotate(6deg)}}
/* ===== flashes / vignettes ===== */
.flash{position:fixed;inset:0;z-index:997;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.34),transparent 62%);animation:flashF .55s ease-out forwards}
@keyframes flashF{to{opacity:0}}
.greenflash{position:fixed;inset:0;z-index:996;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(74,222,128,.30),transparent 64%);animation:flashF .6s ease-out forwards}
.redflash{position:fixed;inset:0;z-index:996;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(251,113,133,.34),transparent 58%);animation:flashF .7s ease-out forwards}
.vignette{position:fixed;inset:0;z-index:996;pointer-events:none;box-shadow:inset 0 0 190px 60px rgba(244,63,94,.75);animation:vig .95s ease-out forwards}
@keyframes vig{0%{opacity:0}14%{opacity:1}100%{opacity:0}}
.vignette.good{box-shadow:inset 0 0 180px 54px rgba(74,222,128,.62);animation-duration:.85s}
.shakeit{animation:bodyShake .48s}
@keyframes bodyShake{0%,100%{transform:translate(0,0)}12%{transform:translate(-13px,4px) rotate(-.5deg)}26%{transform:translate(13px,-4px) rotate(.5deg)}40%{transform:translate(-10px,3px)}54%{transform:translate(10px,-3px)}68%{transform:translate(-6px,2px)}84%{transform:translate(6px,-2px)}}
.zoomit{animation:bodyZoom .5s var(--spring)}
@keyframes bodyZoom{0%,100%{transform:scale(1)}35%{transform:scale(1.014)}}
/* ===== crackers ===== */
.spark{position:fixed;z-index:998;pointer-events:none;animation:crkX var(--d) linear forwards}
.spark i{display:block;border-radius:50%;animation:crkY var(--d) cubic-bezier(.14,.72,.36,1) forwards, crkF var(--d) ease-in forwards}
@keyframes crkX{from{transform:translateX(0)}to{transform:translateX(var(--tx))}}
@keyframes crkY{0%{transform:translateY(0)}58%{transform:translateY(var(--ty))}100%{transform:translateY(calc(var(--ty) + 96px))}}
@keyframes crkF{0%,55%{opacity:1}100%{opacity:0}}
.boom{position:fixed;z-index:998;pointer-events:none;border:3px solid #fff;border-radius:50%;margin:0;animation:crkR .68s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes crkR{from{transform:translate(-50%,-50%) scale(.05);opacity:.98}to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.rocket{position:fixed;z-index:998;pointer-events:none;width:4px;height:16px;border-radius:3px;margin-left:-2px;animation:crkL var(--rd) cubic-bezier(.25,.5,.4,1) forwards}
@keyframes crkL{from{transform:translateY(0) scaleY(1.35);opacity:.15}60%{opacity:1}to{transform:translateY(var(--ry)) scaleY(.7);opacity:.85}}
/* ===== thumbs — the shower ===== */
.tdown{position:fixed;z-index:998;pointer-events:none;user-select:none;line-height:1;filter:drop-shadow(0 3px 9px rgba(0,0,0,.6))}
.tdown.pop{animation:tdPop var(--d) cubic-bezier(.2,.7,.35,1) forwards}
@keyframes tdPop{0%{opacity:0;transform:translate(0,0) rotate(0deg) scale(.25)}
  12%{opacity:1}
  100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--rot)) scale(1.25)}}
.tdown.rain{animation:tdRain var(--d) linear forwards}
@keyframes tdRain{0%{opacity:0;transform:translateY(-40px) rotate(0deg)}
  9%{opacity:1}
  86%{opacity:1}
  100%{opacity:0;transform:translateY(var(--ty)) rotate(var(--rot))}}
.confetti{position:fixed;width:11px;height:15px;top:-20px;z-index:998;pointer-events:none;border-radius:2px}
/* ===== toast ===== */
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-160px);z-index:1001;background:rgba(9,13,28,.95);border:1px solid var(--gold);border-radius:14px;padding:12px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:transform .5s var(--spring);max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .em{font-size:26px}.toast .tt{font-weight:700}.toast .td{font-size:12px;color:var(--muted)}
/* ===== quiz ===== */
.qgroup-h{display:flex;align-items:center;gap:12px;margin:26px 2px 12px;scroll-margin-top:110px}
.qgroup-h .gi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-weight:700;background:var(--grad);color:#08111f;font-size:13px}
.qgroup-h .gt{font-size:17px;font-weight:700}.qgroup-h .gc{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted)}
.qcard{background:var(--glass);border:1px solid var(--glass-brd);border-radius:16px;padding:20px 22px;margin-bottom:14px;backdrop-filter:blur(8px);transition:box-shadow .35s,border-color .35s}
.qcard.hitgood{border-color:rgba(74,222,128,.55);box-shadow:0 0 40px rgba(74,222,128,.22)}
.qcard.hitbad{border-color:rgba(251,113,133,.55);box-shadow:0 0 40px rgba(251,113,133,.22)}
.qnum{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;margin-bottom:6px;display:flex;gap:10px;align-items:center}
.footbar{position:fixed;bottom:0;left:0;right:0;z-index:60;padding:10px 18px;background:rgba(9,13,28,.92);backdrop-filter:blur(14px);border-top:1px solid var(--glass-brd);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.footbar .fp{flex:1;min-width:160px;display:flex;flex-direction:column;gap:5px}
.footbar .fp .lbl{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.footbar .fp .bar{height:7px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden}
.footbar .fp .bar i{display:block;height:100%;width:0;border-radius:7px;background:var(--grad);transition:width .5s var(--spring)}
.ring-wrap{display:flex;gap:30px;align-items:center;flex-wrap:wrap;justify-content:center}
.ring{position:relative;width:200px;height:200px}.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid .big{font-size:44px;font-weight:700;font-family:'JetBrains Mono',monospace;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ring .mid .sm{font-size:12px;color:var(--muted);letter-spacing:.1em}
.grade{font-size:24px;font-weight:700;margin:4px 0}
.meters{margin-top:24px;display:grid;gap:12px}

<div class="bg-fx"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div><div class="orb d"></div></div>

<header>
  <div class="hdr-in">

      <span class="k">MBA · SELF-STUDY</span>

<div class="toast" id="toast"><span class="em" id="toEm">🏅</span><div><div class="tt" id="toTt"></div><div class="td" id="toTd"></div></div></div>

<script>
/* =========================================================================
   MEDIA BASICS — SESSION QUIZ
   Source: the Media Basics session decks, Class 1 through Session 10 —
           landscape, planning, metrics, strategy, audience, market
           prioritisation, objectives and media mix. One section per class.
   MCQ only. Correct option is always authored FIRST in `opts`; positions are
   reshuffled on every attempt. Every numeric answer was verified against an
   independent calculation before publishing.
   ========================================================================= */

const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const rnd=a=>a[Math.floor(Math.random()*a.length)];

/* ---------------- topics ---------------- */
const TOPICS=[
 {id:'land',  name:'India Media Landscape', kick:'adex · reach · medium by medium'},
 {id:'plan',  name:'What Media Planning Is', kick:'definition · eras · data · tools'},
 {id:'metric',name:'Key Media Metrics',      kick:'reach · GRP · CPM · ROAS · SOV', hot:true},
 {id:'strat', name:'Media Strategy',         kick:'hierarchy · funnel · budget · Stride'},
 {id:'aud',   name:'Audience Definition',    kick:'market vs audience · personas · signals'},
 {id:'mkt',   name:'Market Prioritisation',  kick:'CDI · BDI · RMI · quadrants', hot:true},
 {id:'obj',   name:'Media Objectives',       kick:'barrier → task → measurable'},
 {id:'mix',   name:'Media Mix',              kick:'reach curves · scorecard · MMM'},
];

/* ---------------- the quiz ----------------
   t=topic, tag=concept|apply|calc|case, diff, trap=true (marked tricky),
   given=[chips], q=stem, opts=[correct, ...distractors], why=explanation   */
const QUIZ=[

/* ============ 01 · INDIA MEDIA LANDSCAPE ============ */
{t:'land',tag:'concept',diff:'easy',
 q:'The course defines a <b>medium</b> in three parts. Which definition is the one from the deck?',
 opts:['A communication channel with distinct <b>audiences, consumption behaviour and cost structures</b> that enables brands to achieve specific marketing objectives',
       'Any platform on which a brand is able to place a paid advertisement in exchange for money',
       'The creative format an advertiser chooses — a 30-second film, a banner, a billboard or an audio spot',
       'The total pool of consumers a brand is trying to reach within a defined geography'],
 why:'Three clauses, and each one earns its place: <b>audiences</b> (who it delivers), <b>consumption behaviour</b> (how they use it) and <b>cost structures</b> (what it costs to buy). Every trade-off later in the course — reach vs frequency, channel mix, market weight — comes back to those three. The other options describe a <i>placement</i>, a <i>creative format</i> and a <i>target group</i> respectively; none of them is a medium.'},

{t:'land',tag:'apply',diff:'easy',
 given:['Total adex 2025 = ₹1,50,000 cr'],
 q:'Digital took <b>63%</b> of Indian ad revenue in 2025. Roughly what value is that, and which medium was second?',
 opts:['≈ <b>₹94,700 crore</b>, with <b>Television</b> second at ₹28,500 cr (19%)',
       '≈ ₹94,700 crore, with <b>Print</b> second at ₹15,600 cr (10%)',
       '≈ ₹63,000 crore, with Television second — 63% of adex means ₹63,000 cr of ₹1 lakh crore',
       '≈ ₹94,700 crore, with <b>Out-of-Home</b> second, since OOH reaches 61% of urban India weekly'],
 why:'63% of ₹1,50,000 cr = <div class="work">0.63 × 1,50,000 = ₹94,500 cr ≈ ₹94,700 cr as stated</div>The order is <b>Digital 63% · TV 19% · Print 10% · OOH 4% · Radio 2% · Cinema &lt;1%</b>. Print is third, not second. The ₹63,000 cr option quietly changes the total to ₹1 lakh crore. And the OOH option confuses <i>reach</i> with <i>revenue</i> — OOH reaches a lot of people very cheaply, which is exactly why its adex share is small.'},

{t:'land',tag:'concept',diff:'easy',
 q:'The deck\'s strategic takeaway on television is quoted almost word for word in exams. Which is it?',
 opts:['Linear TV delivers <b>reach</b>; Connected TV delivers <b>relevance and results</b> — the future is linear <i>plus</i> connected',
       'Connected TV has replaced linear TV as the primary reach medium for national launches',
       'Linear TV is in terminal decline and should be treated as a residual, regional-only buy',
       'Linear and connected TV are interchangeable once you deduplicate reach across the two screens'],
 why:'The phrasing matters: <b>not linear versus connected — linear + connected.</b> The supporting numbers: linear TV ad revenue growth is <b>0%</b> but it still delivers mass reach; CTV <b>grew 42% in 2025</b> and took <b>27% of large-screen ad revenue</b> (up from 19%), with CTV homes growing 40–60% YoY. "Replaced" overstates it — CTV homes are 60–70 Mn against 210–214 Mn TV households. "Terminal decline" contradicts the reach argument the deck makes for regional markets and live sports.'},

{t:'land',tag:'apply',diff:'medium',trap:true,
 q:'Comparing urban and rural media consumption, which medium is the notable exception where <b>rural is not behind urban</b>?',
 opts:['<b>OOH</b> — 63% rural weekly reach against 61% urban, essentially level',
       'Television — 89% urban and 64% rural, the smallest gap of any medium',
       'YouTube — 93% urban and 52% rural, since video travels best into Bharat',
       'Print — 24% urban and 17% rural, because vernacular dailies dominate rural India'],
 why:'<b>OOH is the leveller: 61% urban, 63% rural.</b> It is the only medium in the table where rural edges ahead. Everything else drops sharply — TV 89→64, YouTube 93→52, Print 24→17, Instagram 84→26 (the widest gap of all). One more crossover worth knowing: <b>UPI has already converged</b> at 45% rural vs 44% urban — payment behaviour crossed over before content behaviour did. TV\'s gap is 25 points, not the smallest.'},

{t:'land',tag:'concept',diff:'medium',
 q:'Print reaches <b>280 million+</b> daily readers, the largest base in the world. Which statement about Indian print is correct?',
 opts:['Indian dailies draw <b>80–85% of revenue from advertising</b>, and the <b>IRS has been suspended since 2019</b>',
       'Indian dailies are subscription-led like their global peers, which insulates them from ad-spend swings',
       'The IRS runs continuously and is the reason print can still be planned with confidence',
       'Print ad spend is falling at around 10% a year as English metro titles lose readers'],
 why:'Two facts, both examinable. Indian print is <b>ad-funded to the tune of 80–85%</b> — unlike subscription-led global peers — which makes it unusually exposed to advertiser sentiment. And the <b>Indian Readership Survey has been suspended since 2019</b>, with a pilot planned for 2026: a medium with 280 million readers currently has <b>no live audience currency</b>. Note also that print ad spend is <b>+1%</b>, growing slightly, not falling 10%; growth lives in <b>Tier 2/3 and vernacular</b> titles while English metro titles plateau.'},

{t:'land',tag:'concept',diff:'medium',
 q:'Which set of claims about <b>audio</b> matches the deck?',
 opts:['Streaming rose from <b>27% to 33%</b> of audio minutes while radio held flat at 4–5%; audio ads are <b>non-skippable</b> with <b>100% SOV in views</b>',
       'Radio and streaming both grew strongly, with radio climbing from 4% to 12% of audio minutes',
       'Streaming rose to 33% and radio collapsed to under 1%, making radio unplannable',
       'Streaming ads are skippable but compensate with far cheaper CPMs than video'],
 why:'The pattern is <b>streaming widening the gap while radio stabilises</b> — 27%→33% versus a flat 4–5%. Radio is described as "still a strong contender", not collapsing. The six stated audio opportunities are worth listing: fully targetable · <b>100% SOV in views</b> (no competing ads) · cross-platform efficiency · brand safe · <b>non-skippable, 100% listen-through</b> · and <b>72% higher attention span</b> versus other video platforms. Skippability is exactly what audio does <i>not</i> have.'},

{t:'land',tag:'concept',diff:'medium',trap:true,
 q:'Four creator-economy figures get confused constantly. Which pairing is right?',
 opts:['<b>₹4,500 Cr</b> is brand spend on influencer marketing; <b>₹12,500 Cr</b> is the total creator economy',
       '₹12,500 Cr is brand spend on influencer marketing; ₹4,500 Cr is what creators earn directly',
       '₹50,000 Cr is the current total creator economy, projected to reach ₹1,00,000 Cr by 2030',
       '$350–400 Bn is the total creator economy, of which ₹12,500 Cr is Indian'],
 why:'Keep the four separate. <b>₹4,500 Cr</b> = brand spend on creator-led campaigns in 2025. <b>₹12,500 Cr</b> = the whole creator economy — direct creator earnings <i>plus</i> brand deals <i>plus</i> platform revenue. <b>₹50,000 Cr</b> = the <i>2030 projection</i> of that ₹12,500 Cr, roughly 4× growth. <b>$350–400 Bn</b> = creator-<i>influenced</i> consumption, i.e. retail and e-commerce sales that creator content touched — not money paid to anyone in media, and the reason it dwarfs the others.'},

{t:'land',tag:'concept',diff:'easy',
 q:'The deck names three structural drivers behind digital\'s growth. Which is <b>not</b> one of them?',
 opts:['<b>Falling CPMs across television</b>, which pushed brand budgets out of TV and into digital video',
       'Retail media — brands paying to appear at the point of purchase on Amazon, Flipkart, Blinkit and Instamart',
       'Performance marketing — paying only for outcomes, making digital the default for growth-focused CFOs',
       'SME advertisers — low entry costs on Google and Meta grew India\'s SME digital ad base over 3× in five years'],
 why:'The three drivers are <b>retail media, performance marketing and SME advertisers</b>. Falling TV CPMs is invented — and the deck actually says the opposite about the mechanism: digital grew on its own merits (measurable sales lift at the point of purchase, outcome-based buying, and a vast new base of small advertisers), not because TV got cheap. The SME number is the striking one: the base grew <b>over 3× in five years</b> as kirana stores, D2C brands and local businesses came online.'},

/* ============ 02 · WHAT MEDIA PLANNING IS ============ */
{t:'plan',tag:'concept',diff:'easy',
 q:'Complete the definition: "Media planning is the process of determining ______ to deliver an advertising message to a target audience — at the most efficient cost."',
 opts:['<b>how, when, where and how often</b>',
       'what, why and to whom',
       'which creative and which format',
       'how much to spend and how much to save'],
 why:'The four words are <b>how, when, where and how often</b> — and the clause "<b>at the most efficient cost</b>" is part of the definition, not decoration. Broken into the five planning questions: <b>WHO</b> (define the audience) · <b>WHAT</b> (message and creative format) · <b>WHERE</b> (channels and vehicles) · <b>WHEN</b> (timing, flighting, frequency) · <b>HOW MUCH</b> (budget). Media planning <b>bridges business objectives and media execution.</b>'},

{t:'plan',tag:'concept',diff:'easy',
 q:'The five stages of the media planning cycle are objectives → audience analysis → channel strategy → budget allocation → execute &amp; optimise. What does the deck stress about the shape of this?',
 opts:['It is a <b>continuous loop</b> — execution and optimisation feed back into the objectives',
       'It is a strict one-way sequence that must be completed before a campaign goes live',
       'The first three stages are the planner\'s job and the last two belong to the buying team',
       'Budget allocation should come first, since it constrains everything downstream'],
 why:'The deck calls it <b>a continuous loop</b>, and the loop is the examinable part — step 5 feeds back into step 1. That is what "always-on planning" means in the <i>then vs now</i> table: campaign planning became continuous planning, and post-campaign reporting became real-time dashboards. Budget first is the classic inversion: budget is stage 4, set <i>after</i> you know the audience and the channel strategy, because the objective determines what the money has to buy.'},

{t:'plan',tag:'apply',diff:'easy',
 q:'Match the era to how success was measured. Which row is correct?',
 opts:['<b>1995 Media Age → Reach &amp; GRPs; 2026 AI Age → Business outcomes</b>',
       '1995 Media Age → Clicks &amp; visits; 2026 AI Age → Engagement',
       '2005 Digital Age → Engagement; 2015 Mobile Age → Clicks &amp; visits',
       '2015 Mobile Age → Business outcomes; 2026 AI Age → Attention seconds'],
 why:'The four eras in order: <b>1995 Media Age → Reach &amp; GRPs · 2005 Digital Age → Clicks &amp; visits · 2015 Mobile Age → Engagement · 2026 AI Age → Business outcomes.</b> The arc is the point — the definition of success climbs from <i>delivery</i> (did the ad appear?) through <i>interaction</i> (did anyone click or engage?) to <i>commercial result</i> (did the business grow?). Attention seconds is a real emerging trend in the deck, but it is listed under "attention metrics", not as the AI Age success measure.'},

{t:'plan',tag:'concept',diff:'easy',
 q:'Which description of the three data types is correct?',
 opts:['<b>1st-party</b> = owned by the brand (CRM, app, site) and most valuable; <b>2nd-party</b> = partner data, good quality but limited scale; <b>3rd-party</b> = brokered, scale but signal-loss concerns',
       '1st-party = bought from data brokers; 2nd-party = owned by the brand; 3rd-party = shared by a partner',
       '1st-party = the largest and cheapest source, which is why it is preferred',
       '3rd-party data is the most valuable because it covers the widest audience'],
 why:'<b>1st-party</b> is data the brand owns — CRM, website, app, loyalty — and carries the <b>highest trust and relevance</b>. <b>2nd-party</b> is a partner\'s first-party data shared directly: good quality, <b>limited scale</b>. <b>3rd-party</b> is aggregated and modelled: <b>scale, but quality and signal-loss concerns</b>. Note that first-party is valuable despite being <i>smaller</i>, not because it is large — which is why the post-cookie shift hurt: losing third-party identifiers pushed everyone back onto data they own, plus contextual targeting.'},

{t:'plan',tag:'apply',diff:'medium',
 q:'Third-party cookies were deprecated. What does the deck say this made critical?',
 opts:['<b>First-party data strategies and contextual targeting</b>',
       'Buying more third-party segments before they disappear entirely',
       'Shifting budgets away from digital and back into television',
       'Relying on panel-based measurement instead of platform reporting'],
 why:'Losing the third-party cookie removed the identifier that made brokered audience data usable at scale. Two things fill the gap: <b>first-party data</b> (which the brand owns and can activate directly) and <b>contextual targeting</b> (targeting the <i>content</i> an ad sits next to rather than the person reading it). This is also why the deck lists "Privacy-first" among emerging trends, and why GA4 is described as <b>first-party data analytics</b>.'},

{t:'plan',tag:'concept',diff:'medium',
 q:'What is the specific cost of <b>siloed</b> planning that integrated planning fixes?',
 opts:['<b>Duplicated impressions</b> — the same consumer is hit repeatedly — which integration fixes through <b>frequency management</b> and a single audience view',
       'Higher media rates, because each channel team negotiates separately and loses volume discounts',
       'Slower campaign launches, since each channel has to wait for the others to be ready',
       'Weaker creative, because channel teams cannot brief a single creative agency'],
 why:'The named failure is <b>duplicated impressions</b>: with no shared audience view, TV, digital and OOH all hit the same person, wasting spend and irritating the consumer. Integration answers with a <b>single audience view</b>, a <b>unified messaging framework</b> and <b>frequency management that prevents over-exposure</b> — plus holistic attribution and cross-channel synergies. Rate negotiation and launch timing are real agency issues but are not what the deck contrasts here.'},

{t:'plan',tag:'apply',diff:'medium',
 q:'You need <b>psychographics — attitudes and lifestyle</b> — to profile an audience before a TV-led plan. Which tool, and what is its stated limitation?',
 opts:['<b>Kantar TGI</b> (60,000 sample, quarterly rolling) — limitation: it is <b>not campaign measurement</b>',
       'BARC (1,80,000 panel, daily) — limitation: it is panel-based',
       'Comscore (web, mobile, video) — limitation: it is not a buying platform',
       'TAM AdEx (all media, daily) — limitation: spend values are estimated'],
 why:'<b>BARC is the TV currency</b> — TVR, reach, GRPs, ATS, CPRP — it tells you <i>how many</i> and <i>how efficiently</i>, never <i>why</i>. For attitudes, lifestyle, brand usage and media consumption you need <b>Kantar TGI</b>, 60,000 urban+rural, quarterly with one-year rolling data. Its limitation is the trap in the question: TGI is <b>not campaign measurement</b>, so you use it to define and profile the audience <i>before</i> planning — you cannot evaluate a live flight on it.'},

{t:'plan',tag:'apply',diff:'medium',trap:true,
 q:'A client asks for your competitor\'s <b>exact</b> media spend. What do you tell them?',
 opts:['No Indian tool provides it — <b>TAM AdEx and Pathmatics both produce estimates</b>, useful for benchmarking and SOV but not actual invoices',
       'BARC publishes competitor spend directly, since it is the industry currency',
       'Comscore reports verified competitor spend across web, mobile and video',
       'GA4 can be configured to read competitor spend through benchmarking reports'],
 why:'This is the limitation column doing real work. <b>TAM AdEx / MAP</b> covers TV, print, radio, digital and OOH daily with ad volumes, SOV and creative tracking — but <b>spend values are estimated</b>. <b>Pathmatics</b> gives creative-level digital visibility with a strong <b>creative library</b> — also <b>estimated spend</b>. Similarweb and Sensor Tower are likewise "estimated". BARC measures <i>audiences</i>, not spend. GA4 measures <i>your own</i> properties — it is first-party by definition and cannot see a competitor.'},

{t:'plan',tag:'concept',diff:'medium',
 q:'What is the stated limitation of <b>Platform Ads</b> (Google, Meta, RMN) as a measurement source?',
 opts:['They are <b>walled gardens</b> — each reports on its own inventory, which fragments cross-channel measurement',
       'They report only weekly, which is too slow for in-flight optimisation',
       'They cannot report cost metrics such as CPM, CTR, CPA or ROAS',
       'They are panel-based and therefore carry sampling error'],
 why:'Platform Ads are <b>real time</b> and report <b>CPM, CTR, CPA and ROAS</b> — speed and cost metrics are their strength, and optimisation is their listed use. The limitation is structural: <b>walled gardens</b>. Each platform grades its own homework on its own inventory, so you cannot deduplicate or compare across them cleanly. It is the same trade-off named in the retail-media section of Chapter 1: <b>precision targeting comes at the cost of concentrated platform power and fragmented cross-channel measurement.</b>'},

/* ============ 03 · KEY MEDIA METRICS ============ */
{t:'metric',tag:'calc',diff:'easy',
 given:['TG = 2,000,000','TV = 700,000','Digital = 500,000','Both = 200,000'],
 q:'What is the campaign\'s <b>net reach</b>, in people and as a percentage of the target group?',
 opts:['<b>1,000,000 people — 50% net reach</b>',
       '1,200,000 people — 60% net reach',
       '1,400,000 people — 70%, because the 200,000 overlap should be added twice',
       '200,000 people — 10%, since only the overlap was genuinely reached by the campaign'],
 why:'Net reach counts <b>unique people exposed at least once</b>, so the overlap is subtracted exactly once:<div class="work">Net = 700,000 + 500,000 − 200,000 = 1,000,000<br>% = 1,000,000 ÷ 2,000,000 × 100 = 50%</div>1,200,000 is the <b>gross reach</b> — the same sum with duplication left in. Comparing the two is how you see how much overlap you are paying for: here, 200,000 duplicated exposures. The 10% option inverts the logic entirely — the overlap is the <i>double-counted</i> part, not the whole audience.'},

{t:'metric',tag:'calc',diff:'easy',
 given:['Impressions = 6,000,000','Net reach = 1,200,000'],
 q:'What is the average <b>frequency</b> (average OTS)?',
 opts:['<b>5.0×</b> — each person reached saw the ad five times on average',
       '0.2× — you divide reach by impressions',
       '7,200,000 — you multiply the two figures',
       '4,800,000 — you subtract reach from impressions'],
 why:'<div class="work">Frequency = total (duplicated) delivery ÷ unduplicated reach = 6,000,000 ÷ 1,200,000 = 5.0</div>The deck writes the formula as <b>Gross Reach ÷ Net Reach</b> and works the example with impressions — both are measures of total duplicated delivery, so use whichever the question gives you. The rule that never changes: <b>unduplicated (net) reach goes in the denominator.</b> Inverting it gives 0.2, which would mean each person saw a fifth of an ad — a good sanity check that you have the ratio the wrong way up.'},

{t:'metric',tag:'calc',diff:'medium',
 given:['1× = 150,000','2× = 250,000','3× = 200,000','4× = 100,000','5+ = 100,000'],
 q:'Total reach is 800,000. At an effective frequency threshold of <b>3+</b>, what is the effective reach?',
 opts:['<b>50%</b> — 400,000 of 800,000 people saw it three or more times',
       '25% — only the 200,000 who saw it exactly three times count',
       '81.25% — everyone except the 150,000 single-exposure viewers',
       '37.5% — the 300,000 who saw it four or more times'],
 why:'"3+" means <b>three or more</b>, so add every band at or above the threshold:<div class="work">3+ = 200,000 + 100,000 + 100,000 = 400,000<br>400,000 ÷ 800,000 × 100 = 50%</div>81.25% is the answer at a <b>2+</b> threshold — worth noticing, because moving the bar from 2+ to 3+ writes off 31 percentage points of your reached audience as ineffective. That is why the threshold has to be justified by message complexity and clutter, not simply assumed at 3. The deck\'s governing line: <b>too few exposures = no recall; too many = wasted spend or irritation.</b>'},

{t:'metric',tag:'calc',diff:'easy',
 given:['Reach = 55%','Frequency = 4'],
 q:'How many <b>GRPs</b> does this flight deliver?',
 opts:['<b>220 GRPs</b>',
       '13.75 GRPs — reach divided by frequency',
       '59 GRPs — reach plus frequency',
       '2,200 GRPs — reach × frequency × 10'],
 why:'<div class="work">GRP = Reach (%) × Frequency = 55 × 4 = 220</div>Note that reach goes in as the <b>number 55</b>, not 0.55 — GRPs are rating <i>points</i>, so a plan reaching 55% of the target four times delivers 220 points of weight. Because it is a product, very different plans collapse to the same number, which is the subject of the next question.'},

{t:'metric',tag:'apply',diff:'medium',trap:true,
 q:'Campaign A delivers <b>70% reach × 3 frequency</b>. Campaign B delivers <b>42% reach × 5 frequency</b>. Both come to 210 GRPs. What follows?',
 opts:['Nothing about effectiveness — <b>GRPs hide the reach–frequency mix</b>; A suits a launch, B suits a complex message in a cluttered category',
       'They are equivalent plans, since GRPs are the industry\'s standard measure of delivered weight',
       'B is better, because higher frequency always builds stronger memory',
       'A is better, because reach is always the more valuable half of the equation'],
 why:'Equal GRPs, <b>very different communication outcomes</b>. A touches 70% of the audience — right when you are <b>launching something new</b> or need wide coverage fast. B concentrates weight on 42% at 5 exposures — right for <b>staying top of mind</b>, or a <b>complex message in a cluttered environment</b>. Neither is universally better; the objective decides. Hence the deck\'s rule: <b>never evaluate a campaign on GRPs alone</b> — add reach, frequency, effective reach (3+, 5+), audience quality, cost and business outcomes.'},

{t:'metric',tag:'calc',diff:'medium',trap:true,
 given:['20 people × 60 min','20 people × 30 min','60 people × 10 min','Universe = 200 · Duration 60 min'],
 q:'100 of 200 panel members sampled the programme. What is the <b>time-weighted TVR</b>?',
 opts:['<b>20.0</b> — against a simple yes/no reach rating of 50',
       '50.0 — half the universe watched, so the rating is 50',
       '40.0 — the average of the three viewing groups weighted by headcount',
       '24.0 — total viewer-minutes divided by the number who actually watched'],
 why:'Every viewing minute contributes, and the denominator is the <b>whole universe at full duration</b>:<div class="work">Viewer-minutes = (20×60) + (20×30) + (60×10) = 1,200 + 600 + 600 = 2,400<br>Maximum = 200 viewers × 60 min = 12,000<br>TVR = 2,400 ÷ 12,000 × 100 = 20.0</div>The old model asked "<i>did</i> you watch?" and would score this 50. The new model asks "<b>how much</b> did you watch?" — and 20.0 reflects that most of the audience left early. The 24.0 option makes the classic error of dividing by the 100 who watched rather than the full 200-person universe; that yields a completion rate, not a rating.'},

{t:'metric',tag:'calc',diff:'easy',
 given:['Media cost = ₹8,00,000','GRPs delivered = 400'],
 q:'What is the <b>CPRP</b>?',
 opts:['<b>₹2,000</b> per rating point',
       '₹0.0005 per rating point',
       '₹3,20,00,000 — cost multiplied by GRPs',
       '₹20,000 — cost divided by GRPs, then divided by 10 to index it'],
 why:'<div class="work">CPRP = Total Media Cost ÷ GRPs Delivered = 8,00,000 ÷ 400 = ₹2,000</div>CPRP is the standard way to <b>compare price efficiency across markets, stations and dayparts before committing budget</b>. It is the offline sibling of CPM: one prices a rating point, the other prices a thousand impressions. Note it is a <i>cost per unit of weight</i>, so a lower CPRP is better.'},

{t:'metric',tag:'calc',diff:'easy',
 given:['Spend = ₹6,000','Impressions = 3,000,000'],
 q:'What is the <b>CPM</b>?',
 opts:['<b>₹2.00</b> per thousand impressions',
       '₹500 — impressions divided by spend, then scaled',
       '₹0.002 — spend divided by impressions, without the ×1,000',
       '₹2,000 — the "M" means million, so divide by 3'],
 why:'<div class="work">CPM = (Total Cost ÷ Impressions) × 1,000 = (6,000 ÷ 3,000,000) × 1,000 = ₹2.00</div>The <b>M is the Roman numeral for a thousand</b>, not million — forgetting the ×1,000 gives ₹0.002, and reading M as million inflates it. CPM is the standard efficiency metric for <b>awareness-focused digital buys</b>, because it compares the price of reach across publishers and formats on equal footing.'},

{t:'metric',tag:'calc',diff:'medium',
 given:['Spend = ₹5,00,000','Revenue = ₹20,00,000'],
 q:'What are the <b>ROI</b> and the <b>ROAS</b> for this campaign?',
 opts:['<b>ROI = 300% and ROAS = 4.0×</b>',
       'ROI = 400% and ROAS = 4.0× — both describe the same thing in different units',
       'ROI = 300% and ROAS = 3.0×, since ROAS also nets off the spend',
       'ROI = 25% and ROAS = 0.25×'],
 why:'They are not the same measure.<div class="work">Net profit = 20,00,000 − 5,00,000 = ₹15,00,000<br>ROI = (15,00,000 ÷ 5,00,000) × 100 = <b>300%</b>   ← uses PROFIT, expressed as a %<br>ROAS = 20,00,000 ÷ 5,00,000 = <b>4.0×</b>        ← uses REVENUE, expressed as a multiple</div>The 400% option makes the commonest slip — using revenue in the ROI formula and forgetting to subtract the cost. And ROAS never nets off spend; if it did it would be ROI. Remember too that ROAS is <b>only as reliable as the attribution model behind it.</b>'},

{t:'metric',tag:'calc',diff:'easy',
 given:['45% of the TG use the platform','15% of the general population use it'],
 q:'What is the <b>affinity index</b>, and what should a planner do with it?',
 opts:['<b>300</b> — the TG is 3× more likely than average, so prioritise this vehicle even if its total audience is smaller',
       '30 — the TG under-indexes badly, so drop the vehicle',
       '3 — the ratio itself is the index, and anything above 1 is good',
       '60 — the difference between the two percentages, doubled'],
 why:'<div class="work">Affinity = (% of TG using ÷ % of general population using) × 100 = (45 ÷ 15) × 100 = 300</div><b>100 is average by construction.</b> An index of 300 means your target is three times likelier than the general population to use this vehicle. The planning rule: <b>prioritise vehicles that over-index with your specific target, even if their total audience is smaller</b> — concentration beats raw size when the budget is finite. Forgetting the ×100 gives 3, which is the right ratio on the wrong scale.'},

{t:'metric',tag:'calc',diff:'medium',
 given:['Brand GRPs = 480','Total category GRPs = 1,500','Brand market share = 20%'],
 q:'What are the brand\'s <b>SOV</b> and <b>ESOV</b>?',
 opts:['<b>SOV = 32%, ESOV = +12</b> — it is out-shouting its market position',
       'SOV = 32%, ESOV = −12 — market share is subtracted from 100, not from SOV',
       'SOV = 20%, ESOV = 0 — share of voice tracks market share by definition',
       'SOV = 3.2%, ESOV = −16.8'],
 why:'<div class="work">SOV = (480 ÷ 1,500) × 100 = 32%<br>ESOV = SOV − Market Share = 32 − 20 = <b>+12</b></div>A <b>positive ESOV sustained over time is associated with a greater likelihood of market share growth</b> — the finding comes from the <b>IPA</b> and effectiveness researchers <b>Les Binet and Peter Field</b>. The deck attaches three caveats you should quote: the relationship also depends on <b>creative quality, competitive intensity and distribution.</b> And remember SOV is <i>relative</i>: the same 500 GRPs is 60% SOV in a quiet category and 20% in a loud one.'},

/* ============ 04 · MEDIA STRATEGY ============ */
{t:'strat',tag:'concept',diff:'easy',
 q:'What is the correct order of the <b>hierarchy of objectives</b>?',
 opts:['Business → Marketing → Communication → <b>Media Objective</b> → Media Strategy → Media Plan',
       'Marketing → Business → Media Objective → Communication → Media Plan → Media Strategy',
       'Business → Communication → Marketing → Media Strategy → Media Objective → Media Plan',
       'Media Objective → Media Strategy → Media Plan → Communication → Marketing → Business'],
 why:'Six levels, and <b>every level must logically support the level above it.</b> The unit of measurement changes as you descend: <b>money → people → perception → delivery → approach → vehicles</b>. Business is in rupees ("₹100 Cr sales in Year 1"), marketing in buyers ("2 lakh first-time buyers"), communication in perception ("awareness 12%→35%"), and the media objective in <b>reach % at a frequency inside a timeframe</b>. The governing line: <b>media planning does not begin with selecting channels — it begins with understanding the business objective.</b>'},

{t:'strat',tag:'apply',diff:'medium',trap:true,
 q:'Which of these is a properly formed <b>media</b> objective rather than a communication objective?',
 opts:['<b>Reach 70% of urban adults 18–35 at an average frequency of 4 within 10 weeks</b>',
       'Increase awareness from 12% to 35% and position the brand as a healthy, tasty snack',
       'Acquire 2 lakh first-time buyers and achieve 15% repeat purchase',
       'Achieve ₹100 crore in sales in Year 1'],
 why:'A media objective is expressed in <b>media delivery</b> — how many people, how often, over what period. "Reach 70% at frequency 4 within 10 weeks" is exactly that. The distractors are the three levels above it: awareness and positioning is the <b>communication</b> objective (what people should know, think or feel); first-time buyers and repeat rate is the <b>marketing</b> objective; ₹100 crore is the <b>business</b> objective. All four are from the same worked example, which is why the level boundaries are worth drilling. Media objectives are always <b>SMART.</b>'},

{t:'strat',tag:'apply',diff:'easy',
 q:'Which KPI set belongs to the <b>awareness</b> stage?',
 opts:['<b>Reach, GRPs, video completion rate, unaided brand recall, CPM</b>',
       'CTR, engagement rate, time on site, brand search volume',
       'CPA, ROAS, conversion rate, incremental sales lift',
       'Repeat rate, lifetime value, churn'],
 why:'Awareness answers the mindset "<i>I don\'t know this brand exists</i>" — so the KPIs measure <b>coverage and memory</b>: reach, GRPs, video impressions and completion, <b>unaided recall</b>, and CPM for efficiency. The others map to consideration ("is this right for me?" → CTR, engagement, time on site, branded search), conversion ("I\'m ready — make it easy" → CPA, ROAS, conversion rate, incremental lift) and loyalty (repeat, LTV, churn). Mixing them is precisely the mistake in the BeanBrew diagnostics — <b>CTR is not an awareness KPI.</b>'},

{t:'strat',tag:'case',diff:'medium',trap:true,
 q:'BeanBrew\'s manager says: <i>"Search has the highest ROAS — stop all awareness advertising and put 100% of the budget into Search."</i> What is the right response?',
 opts:['No — <b>Search captures existing demand but does not create future demand</b>; branded searches and sales will decline once awareness stops',
       'Yes — Search is demonstrably the most profitable channel, so concentrating spend there maximises return',
       'Yes — ROAS is the single KPI that matters, since it ties directly to revenue',
       'No — but the right move is to shift the awareness budget into influencers instead'],
 why:'This is the core insight of the chapter. Search is a <b>harvesting</b> channel: it converts demand that already exists, which is why its ROAS looks so good. It cannot <i>generate</i> the demand it harvests. Cut awareness and the pool of people searching for BeanBrew shrinks month by month — the ROAS stays high while the business quietly contracts. Option B mistakes <i>efficiency</i> for <i>growth</i>; option C ignores that each funnel stage has its own KPI; option D reaches the right verdict for no stated reason.'},

{t:'strat',tag:'case',diff:'medium',
 q:'BeanBrew\'s ROAS rises from <b>3.5× to 5.2×</b>, but new customers fall <b>20%</b>. Most likely explanation?',
 opts:['The campaign is getting more efficient by <b>converting existing brand users rather than acquiring new ones</b>',
       'Awareness has increased dramatically, lifting conversion rates across the board',
       'Click-through rate has doubled, which mechanically raises ROAS',
       'Viewability improved, so more of the impressions were actually seen'],
 why:'<b>A high ROAS can indicate harvesting existing demand instead of growing the customer base.</b> Targeting narrows onto people already close to purchase — cheaper to convert, so ROAS climbs — while the top of the funnel starves and new-customer numbers fall. The three distractors all describe things that would tend to <i>increase</i> new customers, not reduce them, which is how you eliminate them without knowing the answer. The lesson: <b>read ROAS alongside new-customer volume</b>, never alone.'},

{t:'strat',tag:'apply',diff:'medium',
 q:'Which funnel budget split matches a <b>government public-awareness campaign</b>?',
 opts:['<b>70–80% awareness / 15–20% consideration / 5–10% conversion</b> — the objective is reach and behaviour change, not commercial conversion',
       '10–20% / 15–25% / 60–75% — public campaigns must prove measurable action',
       '35% / 30% / 35% — a balanced split is the safe default for any public body',
       '20–30% / 20–30% / 40–60% — the same profile as a mature FMCG brand'],
 why:'Government awareness campaigns sit at the awareness-led extreme, <b>70–80%</b>, because the goal is <b>reach and behaviour change, not a transaction</b>. The opposite extreme is an e-commerce sale event at <b>60–75% conversion</b> — maximising transactions in a short window. The others are the balanced growth-phase split (35/30/35) and the mature FMCG profile (20–30/20–30/40–60). Always attach the caveat: <b>there are no fixed benchmarks</b> — allocation follows category, competitive intensity and the media objective, and budget split is a <b>strategic decision, not an accounting one.</b>'},

{t:'strat',tag:'concept',diff:'medium',
 q:'How do <b>leading</b> and <b>lagging</b> indicators differ in use?',
 opts:['Leading indicators are early signals used to <b>optimise while the campaign is live</b>; lagging indicators are final outcomes used to <b>evaluate whether it worked</b>',
       'Leading indicators are for senior management and lagging indicators are for the buying team',
       'Leading indicators apply to digital channels and lagging indicators to traditional ones',
       'Leading indicators are estimates, and lagging indicators are the same metrics once verified'],
 why:'<b>Leading = optimise mid-flight. Lagging = evaluate after.</b> At awareness, leading is reach/frequency/CPM/VCR while lagging is ad recall and awareness lift. At conversion, leading is add-to-cart and CPA trend while lagging is sales, ROAS and profit. Two patterns to quote: <b>attribution confidence rises as you move down the funnel</b> (awareness lowest — MMM and brand-lift studies; conversion highest — platform attribution plus incrementality tests), and <b>review cadence shortens down the funnel</b> — bi-weekly, weekly, then daily.'},

{t:'strat',tag:'case',diff:'medium',trap:true,
 q:'Stride sells running shoes: <b>62% of sales, 5% growth</b>. Consumers rate it 87% "great running shoes" but only <b>31% "stylish"</b> and <b>28% "comfortable for everyday wear"</b>. What is the diagnosis, and what follows for the plan?',
 opts:['A <b>permission problem</b> — an identity objection, not a product one — so the plan is <b>consideration-led (45%)</b> to reshape perception',
       'A product problem — the shoes are not actually comfortable enough for daily wear, so fix the product first',
       'A distribution problem — Stride is not stocked in lifestyle retail, so conversion spend should lead',
       'An awareness problem — too few people know Stride exists, so an awareness-led 58/27/15 launch split applies'],
 why:'Stride has a <b>credibility surplus</b> in performance (87%, 79%) and a <b>relevance deficit</b> in everyday life (31%, 28%). The sentiment — "I don\'t run", "Stride isn\'t for people like me", "looks too serious" — makes it an <b>identity objection</b>. So: <b>not a product problem, not a quality problem, a permission problem.</b> Retail paths already work, which is why conversion doesn\'t lead at only 20% — the barrier is <b>relevance, not access</b>. And awareness is not the issue: people know Stride, they just don\'t think it is for them. Hence <b>35 / 45 / 20</b>, with the sharpest detail being that <b>running sponsorships move into consideration</b>, because their job changed.'},

/* ============ 05 · AUDIENCE DEFINITION ============ */
{t:'aud',tag:'concept',diff:'easy',
 q:'What separates a <b>target market</b> from a <b>target audience</b>?',
 opts:['Target market is the broad group defined by <b>characteristics</b> (business &amp; product strategy); target audience narrows it by adding <b>observable behaviour</b> (advertising &amp; media strategy)',
       'Target market is who buys today; target audience is who the brand hopes will buy tomorrow',
       'Target market is defined by geography and target audience by age and gender',
       'They are the same thing — "audience" is simply the media team\'s word for the market'],
 why:'The tell is in the examples: <i>"premium smartphone buyers in India"</i> is a market; <i>"young metro professionals <b>planning to upgrade in the next 6 months</b>"</i> is an audience. Every audience example in the deck adds a behaviour or intent signal the market lacks — "actively comparing EVs online", "training for a marathon", "spending ₹1L+/month". A third term completes the set: <b>customer segmentation</b> divides the <i>existing</i> buyer base by past behaviour and active/lapsed status, and belongs to loyalty and lifetime value.'},

{t:'aud',tag:'apply',diff:'easy',
 q:'Which is a properly <b>media-ready</b> audience definition?',
 opts:['<b>Working mothers in metros who seek safe, natural baby-care products, compare reviews online and shop via quick-commerce</b>',
       'Women aged 25–35',
       'Everyone in urban India with a smartphone and disposable income',
       'People who are likely to enjoy our brand\'s tone of voice'],
 why:'The deck contrasts these two directly: <b>not</b> "Women 25–35" <b>but</b> the full definition, which carries <i>who they are, what they need, how they behave and where they shop</i>. A media-ready definition combines <b>who they are, what they need, how they behave, where they spend attention, and what signals show purchase intent</b> — enough for a planner to choose channels and a creative team to write. Option B is a demographic shell; C is a universe, not an audience; D is unmeasurable and unbuyable.'},

{t:'aud',tag:'apply',diff:'medium',
 q:'A brand\'s objective is <b>trial</b> — getting people to try it for the first time. Who should it target?',
 opts:['<b>Switchers or light users</b>, with a strong problem–solution message',
       'Category early adopters, since they always move first',
       'Loyal high-value users, reached through CRM and offers',
       'A new aspiration group that can change what the brand means'],
 why:'The objective determines the audience:<div class="work">Launch      → category users and EARLY ADOPTERS<br>Trial       → SWITCHERS or LIGHT USERS + problem–solution message<br>Retention   → LOYAL / HIGH-VALUE users via CRM and offers<br>Repositioning → a NEW ASPIRATION GROUP that can change brand meaning</div>Early adopters belong to <i>launch</i>; loyalists to <i>retention</i>; the aspiration group to <i>repositioning</i>. The deck\'s illustration: a millet snack brand launching nationally targets urban health-conscious snackers 22–40, but <b>for repeat purchase</b> it shifts to office snackers and parents buying healthier tiffin options — same product, different objective, different audience.'},

{t:'aud',tag:'concept',diff:'easy',
 q:'What is the stated <b>limitation of demographic profiling</b>?',
 opts:['Demographics alone <b>do not explain motivation, media behaviour or buying intent</b>',
       'Demographics are expensive to collect and quickly go out of date',
       'Demographics cannot be used to size an audience',
       'Demographics are unavailable for rural markets in India'],
 why:'Demographics answer <i>who are they, where do they live, what life stage, how large</i> — they are observable and they <b>do</b> size an audience, which is their main strength. What they cannot do is explain <b>motivation, media behaviour or buying intent</b>. That is why the deck layers them: the baby-care example starts as "Women 25–35, new mothers, SEC A/B, metros" and becomes far stronger once you add behaviour — <b>searches for toxin-free products, parenting app usage, baby-category purchases.</b>'},

{t:'aud',tag:'case',diff:'medium',
 q:'Spotify Wrapped is used as the case for which kind of segmentation, and what is the takeaway?',
 opts:['<b>Behavioural</b> — it uses songs played, repeats, skips, genres and listening times, because <b>behaviour predicts future actions better than demographics</b>',
       'Psychographic — it infers personality and values from musical taste',
       'Demographic — it segments listeners by age, city and income band',
       'Customer segmentation — it divides paying subscribers from free users'],
 why:'Wrapped is built entirely on <b>what people actually did</b>: songs listened to most, repeat plays, skips, favourite artists, genres explored, time of listening, podcasts consumed. The chain is <b>listening behaviour → AI → personalised Wrapped → better recommendations and loyalty.</b> The stated takeaway is the examinable line: <b>behaviour predicts future actions better than demographics</b>, which is also why behavioural segmentation is called the most reliable predictor of future purchase — more so than stated preference. Compare with <b>Coca-Cola</b> (demographic, by occasion and life stage) and <b>Apple</b> (psychographic, four mindsets).'},

{t:'aud',tag:'concept',diff:'medium',
 q:'Complete the triangulation rule: "Research explains ___, behaviour shows ___, media data shows ___."',
 opts:['<b>why · what · where</b>',
       'what · why · when',
       'who · what · how much',
       'where · why · who'],
 why:'<b>Research explains WHY, behaviour shows WHAT, media data shows WHERE.</b> The point of the rule is the sentence that precedes it: <b>no single source gives you the full story</b>, so good audience definition is <i>triangulated</i>. The six sources are primary research (surveys, FGDs) · syndicated media data (TGI, GWI) · first-party (CRM, app, site, loyalty) · retail media (search, baskets, category affinity) · social and search signals (Trends, hashtags, sentiment) · platform behaviour (OTT, YouTube, Meta, creator communities).'},

{t:'aud',tag:'concept',diff:'medium',
 q:'Why is <b>RMN (retail media network) data</b> valuable for audience definition?',
 opts:['It is <b>first-party shopper data that sits closest to purchase intent</b>, so it identifies who is <b>actively in-market</b>',
       'It is the cheapest audience data available in India',
       'It covers the whole population, unlike panel-based sources',
       'It is third-party data, so it can be used to target across any channel'],
 why:'RMN data comes from Amazon, Flipkart, Blinkit, Zepto and Swiggy Instamart, and reflects <b>what people search, browse, add to cart, buy and repeat</b>. What can be mined: search terms, basket combinations, brand switching, purchase frequency, category affinity, geo/time patterns. Its distinguishing property is proximity to the moment of purchase — it is <b>closer to purchase intent than broad media data</b> and therefore identifies who is <i>in-market right now</i>. It is emphatically <b>first-party</b> data belonging to the retailer, not third-party.'},

{t:'aud',tag:'concept',diff:'easy',
 q:'What is a <b>buyer persona</b> meant to achieve?',
 opts:['A <b>semi-fictional but data-informed</b> portrait — believable enough for creative teams, precise enough for media planners',
       'A statistically representative average customer, calculated from survey data',
       'A legally accurate description of the brand\'s existing customer base',
       'A creative device with no role in media planning decisions'],
 why:'The phrase to reproduce is <b>"semi-fictional but data-informed"</b>, and the dual test is the examinable part: <b>believable enough for creative teams and precise enough for media planners</b>. Six components: name and life context · category relationship · pain point · trigger · <b>media map</b> · message hook. Look at Sudha Singh (32, Gurgaon, NCCS A — parenting creators, quick-commerce discovery, trigger = doctor recommendation) or Ananya Kapoor (27, Mumbai — dermatologist content, Nykaa reviews, trigger = ingredient innovation): each one ends in a <b>media plan implication</b>, which is the whole purpose.'},

/* ============ 06 · MARKET PRIORITISATION ============ */
{t:'mkt',tag:'calc',diff:'easy',
 given:['TG population in market = 5%','Category sales in market = 8%'],
 q:'What is the <b>CDI</b>, and what does it say?',
 opts:['<b>CDI = 160</b> — the category is over-developed here; people buy more of it than the national norm',
       'CDI = 62.5 — the category is under-developed here',
       'CDI = 40 — the category takes a 40% share of this market',
       'CDI = 1.6 — anything above 1 means the category is over-developed'],
 why:'<div class="work">CDI = (% of category sales in market ÷ % of TG population in market) × 100 = (8 ÷ 5) × 100 = 160</div>Above 110 is <b>over-developed</b>; 160 is well clear of that. Read it as: this market holds 5% of your target population but generates 8% of category demand, so habit, availability or climate is driving consumption. <b>CDI is a market characteristic, not a brand one.</b> Inverting the ratio gives 62.5 and flips the verdict — the single commonest error. Forgetting the ×100 gives 1.6, the right ratio on the wrong scale, since <b>100 is the norm by construction.</b>'},

{t:'mkt',tag:'calc',diff:'medium',
 given:['TG population = 5%','Category sales = 8%','Brand sales = 3%'],
 q:'CDI is 160. What is the <b>BDI</b>, and what does the pair tell you to do?',
 opts:['<b>BDI = 60</b>; high CDI with low BDI means <b>attack</b> — drive ESOV, focus on reach, localise creative',
       'BDI = 60; low BDI means the market is unattractive, so skip it',
       'BDI = 167; the brand is over-developed here, so defend leadership',
       'BDI = 37.5 — you divide brand sales by category sales'],
 why:'<div class="work">BDI = (% of brand sales ÷ % of TG population) × 100 = (3 ÷ 5) × 100 = 60<br>BDI ÷ CDI = 60 ÷ 160 = 0.375  → well below 1.0 = an opportunity</div>Demand is strongly present (CDI 160) but the brand is badly under-indexed (BDI 60). That is the <b>growth / attack quadrant</b>: <b>drive ESOV, focus on reach, localise creative and language.</b> "Skip" is the <i>low CDI · low BDI</i> quadrant — this market has plenty of demand, so skipping it would forfeit the biggest available prize. Dividing brand by category sales gives 37.5, which is a share figure, not a development index — <b>the population base must be the denominator for both indices.</b>'},

{t:'mkt',tag:'concept',diff:'medium',
 q:'A market has <b>low CDI and high BDI</b>. What is the recommended approach?',
 opts:['<b>Niche strength — harvest</b>: retention and repeat-purchase messaging, with distribution and pack economics mattering more than media weight; do not overspend',
       'Attack: the brand is strong, so pour in reach to grow the category',
       'Defend leadership: monitor competitors closely in a highly competitive market',
       'Skip: run test-and-learn budgets only, with a defined exit rule'],
 why:'The brand is extracting an unusually large share from a category that is small here — a <b>niche strength to harvest</b>. Extra media weight has little category demand left to convert, so the action set is <b>retention and repeat-purchase communication</b>, with <b>distribution and pack economics mattering more than media weight</b>, and an explicit warning: <b>do not overspend; monitor sales closely.</b> "Defend leadership" is <i>high CDI · high BDI</i>. "Skip" is <i>low · low</i>, judged on category penetration movement rather than brand share, with a <b>defined exit rule.</b>'},

{t:'mkt',tag:'apply',diff:'medium',trap:true,
 given:['Brand national sales = ₹500 Cr','Delhi brand sales = ₹100 Cr','Delhi category sales = ₹1,250 Cr'],
 q:'What are Delhi\'s <b>contribution</b> and <b>market share</b>, and what does each imply?',

       'Contribution 8% and market share 20% — the two are simply reciprocals',
       'Contribution 20% and market share 20%, since both measure the brand\'s position in Delhi',
       'Contribution 40% and market share 8%'],
 why:'Different denominators, different questions:<div class="work">Contribution = 100 ÷ 500 = 20%   ← of the brand\'s TOTAL NATIONAL sales<br>Market share = 100 ÷ 1,250 = 8%  ← of CATEGORY sales in that market</div>The line to memorise: <b>contribution tells you what you stand to lose; market share tells you what you stand to gain.</b> Delhi is simultaneously a big chunk of your business (protect it) and a market where you own only 8% of the category (room to grow). Reading one as the other is exactly how plans end up defending markets that should be attacked.'},

{t:'mkt',tag:'concept',diff:'medium',
 q:'A market shows a <b>low BDI</b>. Which pitfall does the deck warn about before you increase media weight?',
 opts:['<b>Do not confuse distribution with demand</b> — a low BDI may simply mean poor availability, and more media will not fix a distribution problem',
       'Do not use a target-audience population base; always use total population for consistency',
       'Do not compare BDI with CDI, since they use different denominators',
       'Do not calculate BDI for markets contributing less than 5% of national sales'],
 why:'Five pitfalls are listed, and this is the one that most often wastes budget: <b>a low BDI may simply mean poor availability. Increasing media won\'t solve a distribution problem.</b> The others: don\'t ignore <b>absolute market size</b> (a BDI of 300 in a tiny market is still little revenue); <b>use the target audience as the population base</b> wherever possible — the opposite of option B; <b>look beyond the competition</b>, since a high-CDI, low-BDI market may be dominated by strong regional brands; and <b>never use the indices in isolation</b>. CDI and BDI are designed to be compared and share a base, so option C inverts the method.'},

{t:'mkt',tag:'case',diff:'medium',trap:true,

       'It is the highest-priority market, since it has the largest population of any state on the list',
       'It is a stronghold to defend, because 13% of category sales is a large absolute number',

{t:'mkt',tag:'apply',diff:'easy',

{t:'mkt',tag:'concept',diff:'medium',
 q:'How do the <b>Retail Media Index</b> and the <b>Quick Commerce Index</b> differ?',
 opts:['RMI asks <b>can I advertise effectively where people shop</b> (considered purchases); QCI asks <b>can the consumer act within minutes</b> (impulse purchases)',

       'RMI covers online retail and QCI covers offline modern trade',
       'RMI applies to metros and QCI applies to Tier-2 and Tier-3 markets'],

/* ============ 07 · MEDIA OBJECTIVES ============ */
{t:'obj',tag:'concept',diff:'easy',
 q:'"Increase brand awareness." What are the three things missing from this objective?',
 opts:['<b>No number, no timeframe, no way to know it worked</b>',
       'No channel, no budget, no creative direction',
       'No audience, no geography, no competitor benchmark',
       'No approval from the client, no brief, no measurement tool'],
 why:'The deck puts three real client-brief objectives up — "increase brand awareness", "get more people talking about us", "be the market leader in consumer minds" — and lands the line: <b>an objective you cannot measure is not an objective.</b> A number and a timeframe are what make it checkable. Channels and budget are deliberately <i>absent</i> from a media objective — they belong to the strategy and plan below it. Remember the analogy: <b>media channels are the route; the media objective is the destination.</b>'},

{t:'obj',tag:'concept',diff:'medium',trap:true,
 q:'In the six-step method, when are reach, frequency and channel mix decided?',
 opts:['<b>Only after the growth source and the barrier to growth have been identified</b>',

       'In parallel with the business problem, to save time in the planning cycle',
       'After the budget is fixed, since budget determines achievable reach'],
 why:'This is the sequencing rule at the heart of the session: <b>reach, frequency and channel mix are set only once the source of growth and the barrier to growth are identified.</b> The six steps run <b>business problem → growth source → barrier → realistic role of media → delivery requirements → evidence-based targets.</b> Planner A jumps to "TV + YouTube + Search"; Planner B asks "<i>what is stopping growth — awareness, salience, conversion, distribution or repeat?</i>" One of the six named traps is precisely <b>"choosing a funnel label without diagnosis"</b>, whose correction is <b>name the barrier and growth source first.</b>'},

{t:'obj',tag:'apply',diff:'medium',

       'Build reach and memory',

 why:'The barrier-to-task mapping is a table worth memorising outright:<div class="work">Low awareness      → build reach + memory<br>Low understanding  → educate / demonstrate<br>Low trust          → BORROWED CREDIBILITY FROM KOLs<br>Journey drop-off   → retarget / reduce friction<br>Low repeat         → re-engage at renewal or replenishment</div>Trust cannot be asserted by the brand about itself — it has to be lent by a credible third party, which is what a key opinion leader provides. The distractors are the correct answers to <i>low awareness</i>, <i>journey drop-off</i> and <i>low repeat</i> respectively.'},

{t:'obj',tag:'concept',diff:'easy',
 q:'Which of these can media <b>not</b> fix on its own?',

{t:'obj',tag:'apply',diff:'easy',
 q:'Which of these is the <b>strong</b> version of "increase awareness"?',
